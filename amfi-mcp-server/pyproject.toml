[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amfi-mcp-server"
version = "0.1.0"
description = "An MCP server exposing India mutual-fund NAV data from AMFI (official, free, no API key)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chirantan Lonkar" },
]
keywords = ["mcp", "model-context-protocol", "mutual-funds", "amfi", "india", "nav", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/SetuAI/amfi-mcp-server"
Repository = "https://github.com/SetuAI/amfi-mcp-server"
Issues = "https://github.com/SetuAI/amfi-mcp-server/issues"

[project.scripts]
amfi-mcp = "amfi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amfi_mcp"]
